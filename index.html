<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to RYO</title>
    
    <!-- Meta descripción (Atrae clics en Google, máximo ~155 caracteres) -->
    <meta name="description" content="Accede a RYO de forma segura. Inicia sesión en tu panel de control para gestionar incidencias, chat y herramientas de la plataforma de manera rápida y eficiente.">
    
    <!-- Autor y Robots -->
    <meta name="author" content="RYO">
    <meta name="robots" content="index, follow">

    <!-- Open Graph para Redes Sociales (LinkedIn, Twitter, WhatsApp, Facebook) -->
    <meta property="og:title" content="Iniciar Sesión | RYO">
    <meta property="og:description" content="Accede a tu cuenta en RYO para gestionar todas tus herramientas profesionales.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://espinosa-dev.github.io/ryo">
    <meta property="og:image" content="https://espinosa-dev.github.io/ryo/assets/img/whiteLettersLogo.png"> <!-- Ruta de tu logo -->
    
    <link rel="stylesheet" href="./css/identificacion.css">
    <link rel="shortcut icon" href="./assets/ryo-favicon.ico" type="image/x-icon">


</head>

<body>
    <main class="login-container">
    <div class="login-card">
        <h2>Iniciar Sesión</h2>
        <p class="subtitle">Bienvenido de nuevo a RYO</p>

        <form id="loginForm">
            <div class="input-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" placeholder="nombre@ejemplo.com" required />
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required />
            </div>

            <div class="form-actions">
                <a href="#forgot" class="forgot-link">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="submit-btn">Ingresar</button>
        </form>
    </div>
</main>
    <script src="./js/identification.js"></script>
</body>

</html>
